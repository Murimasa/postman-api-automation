@'
name: API Regression Pipeline (Newman)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman & HTML Extra Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Execute Full CRUD Suite
        run: |
          newman run "collections/Restful Booker API Automation.postman_collection.json" \
            -e "environments/Restful-Booker-Prod.postman_environment.json" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report/crud-report.html

      - name: Execute Data-Driven Test Suite (DDT)
        run: |
          newman run "collections/Restful Booker API Automation.postman_collection.json" \
            -e "environments/Restful-Booker-Prod.postman_environment.json" \
            -d "data/testdata.json" \
            --folder "DDT - Create Booking" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report/ddt-report.html

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-reports
          path: newman-report/